<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex">
<link rel="preload" href="assets/fonts/tg-ext.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/fonts/tg-ext-bold.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/reel/reel_poster.jpg" as="image" fetchpriority="high">
<link rel="preload" href="assets/night/facade.jpg" as="image">
<link rel="stylesheet" href="css/site.css">
</head>
<body class="is-intro">
<div class="cur" id="cur"><span class="cl">DRAG</span></div>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <div class="cell">
      <nav class="nav lab" aria-label="Main">
        <a href="#"><span class="t">About Us</span></a>
        <a href="#projects"><span class="t">Portfolio</span></a>
        <button type="button"><span class="t">Solutions</span></button>
        <a href="#"><span class="t">Broker Program</span></a>
        <a href="#"><span class="t">Partnerships</span></a>
        <a href="#"><span class="t">News</span></a>
      </nav>
    </div>
    <div class="cell c"><a class="wm" href="#"><img src="assets/brand/logo-white.png" alt="CI Design + Build"></a></div>
    <div class="cell r meta-r">
      <a class="cta-blk" href="#cta"><span class="t">Begin<br>Your<br>Better Life</span><i class="sqd"></i></a>
      <button class="menu-sq" type="button" aria-label="Menu"><i></i><i></i></button>
    </div>
  </div>
</header>

<!-- ================================================================== 01 HERO · the CI reel (One Bennett at blue hour → the window → inside) -->
<section class="hero" id="hero">
  <canvas class="gl" id="gl" aria-hidden="true"></canvas>
  <video id="vid" class="glv" muted playsinline loop preload="auto" poster="assets/night/int_night_poster.jpg">
    <source id="vsrc" src="assets/night/int_night_720.mp4" type="video/mp4">
  </video>
  <div class="gl-fallback" id="glFallback" aria-hidden="true"></div>
  <video id="reel" class="reel" muted playsinline preload="auto" poster="assets/reel/reel_poster.jpg" disablepictureinpicture disableremoteplayback aria-label="CI Design + Build — One Bennett Park"></video>
  <div class="slides" id="slides" aria-hidden="true"></div>
  <div class="veil" id="veil" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="dark" id="dark" aria-hidden="true"></div>

  <svg class="logo" id="logo" viewBox="0 0 710 797" aria-hidden="true">
    <defs>
      <mask id="mC" maskUnits="userSpaceOnUse" x="0" y="0" width="710" height="797"><path id="cMask" class="cmask" d="M491.04 273.32 A184 173 0 1 0 491.04 456.68"/></mask>
      <mask id="mT" maskUnits="userSpaceOnUse" x="0" y="0" width="710" height="797"><rect id="tMask" x="80" y="640" width="0" height="60" fill="#fff"/></mask>
    </defs>
    <path id="sq" class="sq" d="M602 578 V620 H96 V109 H602 V152"/>
    <path id="ib" class="ib" d="M601 180 V549"/>
    <path id="cF" class="cfill" fill-rule="evenodd" mask="url(#mC)" d="__C_PATH__"/>
    <path id="tF" class="tfill" fill-rule="evenodd" mask="url(#mT)" d="__T_PATH__"/>
  </svg>

  <div class="pre" id="pre" aria-hidden="true">
    <div class="mono coords">41.89° N · 87.62° W</div>
    <div class="mono city">CHICAGO, IL</div>
    <div class="count"><span id="cnt">00</span><sup>%</sup></div>
  </div>

  <div class="hero-ui">
    <span class="rule-h" aria-hidden="true"></span><span class="rule-v" aria-hidden="true"></span>
    <h1 class="hero-title bi" id="title">Redefining<br>the art of living</h1>
    <div class="hero-ctas" id="row">
      <a class="blk fill" href="#about"><span class="t">Explore<br>CI</span><i class="sqd"></i></a>
      <a class="blk line" href="#cta"><span class="t">Begin<br>Your<br>Better<br>Life</span><i class="sqd"></i></a>
    </div>
    <div class="preview" id="preview" aria-hidden="true">
      <span class="pv-box"><i class="dot"></i></span>
      <span class="pv-img"><img src="assets/reel/th/bar.jpg" alt=""></span>
      <span class="pv-img"><img src="assets/img2/dining_w.jpg" alt=""></span>
      <span class="pv-div"></span>
    </div>
  </div>
  <button class="skip mono" id="skip" type="button"><span class="ln"></span>SKIP</button>
</section>
